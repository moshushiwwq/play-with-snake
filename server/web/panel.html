<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>访问密码与排行榜 · Play With Snake</title>
<style>
/* ============================================================
   与服务端 Qt 界面、客户端页面共用同一套设计令牌：
   白底、深蓝灰文字、青绿渐变主按钮、浅色描边卡片
   ============================================================ */
:root{
  --ink:#1a2233;--ink2:#3a4a66;--ink3:#5a6b87;--dim:#8a99b8;
  --line:rgba(30,50,90,.12);--line-soft:rgba(30,50,90,.09);
  --field:#f7fafd;--ok:#0aa96a;--err:#d64545;--warn:#d99b00;
  --grad:linear-gradient(135deg,#41e39a,#22b8f0);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink);background:#fff;padding:16px}
.wrap{max-width:940px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.mark{width:34px;height:34px;border-radius:10px;background:var(--field);
  border:1px solid var(--line-soft);display:grid;place-items:center;color:var(--ok)}
.mark svg{width:22px;height:22px;display:block}
h1{font-size:16px;font-weight:800}
.sub{font-size:11.5px;color:var(--dim);margin-top:2px}
.card{background:#fff;border:1px solid var(--line-soft);border-radius:14px;padding:14px;box-shadow:0 1px 4px rgba(30,50,90,.05)}
.card h2{font-size:11px;letter-spacing:1.5px;color:var(--dim);font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:6px}
h2 svg{width:14px;height:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
label{font-size:12.5px;color:var(--ink3);font-weight:700;min-width:72px}
input{flex:1;min-width:140px;padding:9px 11px;border-radius:9px;font-family:inherit;font-size:14px;
  background:var(--field);border:1.5px solid var(--line);color:var(--ink);outline:none}
input:focus{border-color:#22b8f0;background:#fff}
button{font-family:inherit;font-weight:800;font-size:13px;cursor:pointer;border-radius:10px;
  border:1.5px solid rgba(30,50,90,.11);background:#fff;color:var(--ink2);padding:9px 14px}
button:hover{background:var(--field)}
button:active{transform:scale(.97)}
button.primary{border:none;color:#04121a;background:var(--grad);box-shadow:0 5px 16px rgba(40,190,150,.28)}
button.danger{color:var(--err);border-color:rgba(214,69,69,.30);background:#fff5f5}
button:disabled{opacity:.45;cursor:not-allowed}
.note{font-size:11.5px;color:var(--dim);line-height:1.7}
.state{font-weight:800}
.state.ok{color:var(--ok)}
.state.warn{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--dim);font-size:11px;font-weight:800;padding:7px 6px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
td{padding:7px 6px;border-bottom:1px solid rgba(30,50,90,.06)}
td.mono{font-family:ui-monospace,Consolas,monospace}
.empty{color:var(--dim);text-align:center;padding:16px 0}
.msg{font-size:12px;margin-top:6px;min-height:16px}
.msg.err{color:var(--err)}
.msg.ok{color:var(--ok)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:600px){
  body{padding:10px}
  .row{flex-direction:column;align-items:stretch}
  label{min-width:0}
  .row button{width:100%}
  th:nth-child(n+5),td:nth-child(n+5){display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 17c0-3.4 2.6-5.6 5.6-5.6h3.4c1.5 0 2.5-.9 2.5-2.2S15.5 7 14 7H8.6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="17.8" cy="17.4" r="2.6" fill="currentColor"/>
      </svg>
    </div>
    <div>
      <h1>访问密码与排行榜</h1>
      <div class="sub">Play With Snake · 服务器面板（其余功能已在桌面程序中实现）</div>
    </div>
  </header>

  <!-- 登录（仅在已设置密码且未登录时显示） -->
  <section class="card" id="loginCard" style="display:none">
    <h2>
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4.6" y="10.4" width="14.8" height="9.6" rx="2.3"/><path d="M8.1 10.4V7.5a3.9 3.9 0 0 1 7.8 0v2.9"/><circle cx="12" cy="15.3" r="1.4"/></svg>
      管理员登录
    </h2>
    <div class="row">
      <label>访问密码</label>
      <input type="password" id="loginPass" placeholder="请输入访问密码" autocomplete="off">
      <button class="primary" id="btnLogin">登 录</button>
    </div>
    <div class="msg" id="loginMsg"></div>
  </section>

  <!-- 访问密码 -->
  <section class="card" id="pwCard">
    <h2>
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8.4" cy="8.4" r="4"/><path d="M11.2 11.2 20 20M17.4 17.4l2-2M15 15l2-2"/></svg>
      访问密码
    </h2>
    <div class="row">
      <label>当前状态</label>
      <span class="state" id="pwState">读取中…</span>
    </div>
    <div class="row" id="oldRow" style="display:none">
      <label>旧密码</label>
      <input type="password" id="oldPass" placeholder="修改或清除密码时需要填写" autocomplete="off">
    </div>
    <div class="row">
      <label>新密码</label>
      <input type="password" id="newPass" placeholder="留空表示清除密码" autocomplete="off">
    </div>
    <div class="row">
      <button class="primary" id="btnSavePw">保存密码</button>
      <button class="danger" id="btnClearPw">清除密码</button>
      <button id="btnLogout" style="display:none">退出登录</button>
    </div>
    <div class="msg" id="pwMsg"></div>
    <div class="note">密码仅以 scrypt 高强度哈希保存在本机配置文件中，不会出现明文；连续 5 次失败会锁定来源 IP 一段时间。</div>
  </section>

  <!-- 排行榜 -->
  <section class="card">
    <h2>
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.4 4.4h9.2v4.6a4.6 4.6 0 0 1-9.2 0z"/><path d="M7.4 5.6H4.6v2.2a2.6 2.6 0 0 0 2.6 2.6M16.6 5.6h2.8v2.2a2.6 2.6 0 0 1-2.6 2.6"/><path d="M12 13.6v3.2M8.6 19.6h6.8"/></svg>
      排行榜（前 30）
    </h2>
    <div class="row">
      <button class="primary" id="btnRefresh">刷新排行榜</button>
      <span class="note" id="boardMeta"></span>
    </div>
    <div id="boardBox"><div class="empty">加载中…</div></div>
    <div class="note" style="margin-top:8px">异常数据（校验码不符）在服务端会被直接过滤，不会出现在榜单中；备注由管理员在桌面程序中维护。</div>
  </section>
</div>

<script>
(function(){
  'use strict';
  function $(id){ return document.getElementById(id); }
  var authState = { enabled:false, authed:false };

  function setMsg(el, text, kind){
    el.textContent = text || '';
    el.className = 'msg' + (kind ? ' ' + kind : '');
  }

  function status(){
    return fetch('/api/auth/status', { cache:'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(j){
        authState = { enabled: !!j.enabled, authed: !!j.authed };
        $('loginCard').style.display = (authState.enabled && !authState.authed) ? '' : 'none';
        $('pwCard').style.display = (authState.enabled && !authState.authed) ? 'none' : '';
        $('pwState').textContent = authState.enabled
          ? (authState.authed ? '已设置（已登录）' : '已设置（未登录）')
          : '未设置（任何能访问本机的人都可以修改设置）';
        $('pwState').className = 'state ' + (authState.enabled ? 'ok' : 'warn');
        $('oldRow').style.display = authState.enabled ? '' : 'none';
        $('btnLogout').style.display = authState.authed ? '' : 'none';
        return authState;
      })
      .catch(function(){
        $('pwState').textContent = '无法连接服务器（请先在桌面程序中启动服务）';
        $('pwState').className = 'state warn';
      });
  }

  function loadBoard(){
    var box = $('boardBox');
    fetch('/api/leaderboard', { cache:'no-store' })
      .then(function(r){
        if (r.status === 401) throw new Error('需要登录后查看排行榜');
        return r.json();
      })
      .then(function(j){
        var rows = j.rows || [];
        $('boardMeta').textContent = '共 ' + rows.length + ' 条';
        if (!rows.length){ box.innerHTML = '<div class="empty">暂无人上榜</div>'; return; }
        var html = '<table><thead><tr><th>名次</th><th>玩家</th><th>总分</th><th>胜场</th><th>联机局数</th><th>来源 IP</th><th>备注</th></tr></thead><tbody>';
        rows.forEach(function(r, i){
          html += '<tr><td class="mono">' + (i + 1) + '</td><td>' + esc(r.name || '-') + '</td>' +
            '<td>' + (r.score || 0) + '</td><td>' + (r.wins || 0) + '</td><td>' + (r.mpGames || 0) + '</td>' +
            '<td class="mono">' + esc(r.ip || '-') + '</td>' +
            (r.note ? '<td>' + esc(r.note) + '</td>' : '<td></td>') + '</tr>';
        });
        html += '</tbody></table>';
        box.innerHTML = html;
      })
      .catch(function(e){
        box.innerHTML = '<div class="empty">' + esc(e.message || '排行榜加载失败') + '</div>';
      });
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function post(path, body){
    return fetch(path, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body), cache:'no-store'
    }).then(function(r){ return r.json().catch(function(){ return {ok:false,msg:'响应解析失败'}; }); });
  }

  $('btnLogin').onclick = function(){
    var pwd = $('loginPass').value;
    if (!pwd){ setMsg($('loginMsg'), '请输入访问密码', 'err'); return; }
    post('/api/auth/login', { password: pwd }).then(function(j){
      if (j.ok){
        setMsg($('loginMsg'), '登录成功', 'ok');
        $('loginPass').value = '';
        status().then(loadBoard);
      } else {
        setMsg($('loginMsg'), j.msg || '登录失败', 'err');
      }
    });
  };
  $('loginPass').onkeydown = function(e){ if (e.key === 'Enter') $('btnLogin').click(); };

  $('btnSavePw').onclick = function(){
    var np = $('newPass').value;
    if (!np){ setMsg($('pwMsg'), '新密码不能为空；如需清除密码请点「清除密码」', 'err'); return; }
    post('/api/auth/set', { oldPassword: $('oldPass').value, newPassword: np }).then(function(j){
      setMsg($('pwMsg'), j.msg || (j.ok ? '已保存' : '保存失败'), j.ok ? 'ok' : 'err');
      if (j.ok){ $('newPass').value = ''; $('oldPass').value = ''; status(); }
    });
  };

  $('btnClearPw').onclick = function(){
    if (!confirm('确定要清除访问密码吗？清除后任何能访问本机的人都可以修改设置。')) return;
    post('/api/auth/set', { oldPassword: $('oldPass').value, newPassword: '' }).then(function(j){
      setMsg($('pwMsg'), j.msg || (j.ok ? '已清除' : '清除失败'), j.ok ? 'ok' : 'err');
      if (j.ok){ $('oldPass').value = ''; status(); }
    });
  };

  $('btnLogout').onclick = function(){
    post('/api/auth/logout', {}).then(function(){ status(); });
  };

  $('btnRefresh').onclick = function(){ status().then(loadBoard); };

  status().then(function(st){
    if (!st.enabled || st.authed) loadBoard();
  });
})();
</script>
</body>
</html>
